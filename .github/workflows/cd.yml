# .github/workflows/cd.yml
#
# Blog-to-Podcast Agent — Continuous Deployment Pipeline
#
# TRIGGERS:
#   - Every push to main (after CI passes on a PR, this runs on merge)
#   - Manual trigger via workflow_dispatch (useful for re-deploying without a code change)
#
# JOBS:
#   1. build-and-push : Build both Docker images and push to AWS ECR
#   2. deploy         : SSH into EC2, pull new images, restart containers, health check
#
# KEY DESIGN DECISIONS:
#   - AWS authentication uses OIDC (OpenID Connect) — no long-lived AWS access keys stored
#     in GitHub Secrets. GitHub presents a short-lived token; AWS validates it against the
#     GitHubActionsECRPushRole trust policy created in Phase 1.
#   - Images are tagged with BOTH :latest (for easy `docker compose pull`) AND
#     :<git-sha> (for rollback: `docker compose pull image:abc1234`)
#   - Health check polls /health every 10s for up to 200s before failing the deploy
#   - concurrency: cancel-in-progress prevents two CD runs racing each other

name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allows manual re-deploy from the GitHub Actions UI

# Cancel any in-progress CD run for the same ref when a new one is triggered.
# Prevents two deploys running simultaneously and racing on the same EC2.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: BUILD AND PUSH DOCKER IMAGES TO ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "Build & Push to ECR"
    runs-on: ubuntu-latest

    # CRITICAL: These permissions are REQUIRED for OIDC to work.
    # id-token: write  → allows the job to request an OIDC token from GitHub
    # contents: read   → allows checkout
    permissions:
      id-token: write
      contents: read

    # Expose the short SHA so the deploy job can reference the exact image built.
    outputs:
      image-tag: ${{ steps.meta.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS Authentication via OIDC ────────────────────────────────────────
      # This step exchanges GitHub's OIDC token for temporary AWS credentials.
      # No AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY stored anywhere.
      # The role ARN is constructed from the AWS_ACCOUNT_ID secret.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsECRPushRole
          aws-region: ${{ secrets.AWS_REGION }}

      # ── ECR Login ──────────────────────────────────────────────────────────
      # Authenticates Docker with the ECR registry.
      # Outputs `registry` = "<account>.dkr.ecr.<region>.amazonaws.com"
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Docker Buildx ──────────────────────────────────────────────────────
      # Required for the build-push-action and GitHub Actions layer cache.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Image Tag ─────────────────────────────────────────────────────────
      # Short 8-char git SHA used as an immutable image tag alongside :latest.
      # This enables rollback: docker compose pull image:<old-sha>
      - name: Compute short SHA tag
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      # ── Build & Push: API Image ────────────────────────────────────────────
      # Builds Dockerfile.api and pushes two tags to ECR:
      #   :latest          → always points to the most recent build
      #   :<8-char-sha>    → immutable reference to this exact commit
      # GitHub Actions layer cache (type=gha) reuses unchanged layers across runs.
      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-api:latest
            ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

      # ── Build & Push: Frontend Image ───────────────────────────────────────
      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-frontend:latest
            ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-frontend:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max

      - name: Report pushed image tags
        run: |
          echo "=== Images pushed to ECR ==="
          echo "API:      ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-api:${{ steps.meta.outputs.sha }}"
          echo "Frontend: ${{ steps.ecr-login.outputs.registry }}/blog-to-podcast-frontend:${{ steps.meta.outputs.sha }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: DEPLOY TO EC2
  # ─────────────────────────────────────────────────────────────────────────────
  # Only runs AFTER build-and-push succeeds.
  # SSHes into the EC2 instance and performs a rolling container replacement.
  deploy:
    name: "Deploy to EC2"
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      # ── SSH Deploy ─────────────────────────────────────────────────────────
      # appleboy/ssh-action connects to EC2 and runs the script block remotely.
      # Secrets are substituted by GitHub Actions BEFORE the script is sent —
      # they never appear in plain text in the remote shell.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m    # Ollama model pull on first deploy can take time
          script: |
            set -e   # Exit immediately if any command fails

            echo "=============================================="
            echo "  Blog-to-Podcast Agent — Deploying"
            echo "  Commit: ${{ github.sha }}"
            echo "  Triggered by: ${{ github.actor }}"
            echo "=============================================="

            cd /home/ec2-user/podcast-agent

            # ── Step 1: Authenticate Docker with ECR ───────────────────────
            # EC2 instance profile (EC2ECRPullRole) provides credentials automatically.
            # No hardcoded AWS keys needed on the server.
            echo "[1/4] Logging into ECR..."
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login \
                  --username AWS \
                  --password-stdin \
                  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
            echo "      ECR login successful."

            # ── Step 2: Pull latest images ─────────────────────────────────
            # Pulls both :latest tags pushed by Job 1.
            # Only downloads layers that changed — cached layers are skipped.
            echo "[2/4] Pulling latest images from ECR..."
            docker compose -f docker-compose.prod.yml pull
            echo "      Images pulled."

            # ── Step 3: Restart containers with new images ─────────────────
            # `up -d`              → start/update containers in background
            # `--remove-orphans`   → remove containers for services no longer in compose file
            # Docker replaces only containers whose image has changed.
            echo "[3/4] Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "      Containers restarted."

            # ── Step 4: Health check gate ──────────────────────────────────
            # Poll the /health endpoint every 10 seconds for up to 200 seconds.
            # The CrossEncoder model load takes ~30-60s on t3.medium.
            # If health check fails, the deployment is marked as FAILED and
            # GitHub sends a notification. The old container stays running.
            echo "[4/4] Waiting for API to become healthy..."
            MAX_ATTEMPTS=20
            for i in $(seq 1 $MAX_ATTEMPTS); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo ""
                echo "=============================================="
                echo "  Deployment SUCCESSFUL!"
                echo "  Healthy after $((i * 10))s"
                echo "  Frontend : http://${{ secrets.EC2_HOST }}"
                echo "  API Docs : http://${{ secrets.EC2_HOST }}:8000/docs"
                echo "  Health   : http://${{ secrets.EC2_HOST }}:8000/health"
                echo "=============================================="
                exit 0
              fi
              echo "  ... not healthy yet (${i}0s elapsed, waiting...)"
              sleep 10
            done

            # Health check timed out — print recent logs to help diagnose
            echo ""
            echo "=============================================="
            echo "  ERROR: API did not become healthy in $((MAX_ATTEMPTS * 10))s"
            echo "  Recent API container logs:"
            echo "=============================================="
            docker compose -f docker-compose.prod.yml logs api --tail=40
            exit 1

# .github/workflows/ci.yml
#
# Blog-to-Podcast Agent — Continuous Integration Pipeline
#
# TRIGGERS:
#   - Every push to main or any feature/* branch
#   - Every pull request targeting main
#
# JOBS (run in parallel where possible):
#   1. lint        : ruff (lint) + black (format check)  — fast, no Poetry needed
#   2. test        : install full deps via Poetry + run pytest
#   3. docker-build: build both Docker images (runs only after lint + test pass)
#
# KEY DESIGN DECISIONS:
#   - Lint runs on pip (no Poetry) — fastest possible feedback on style issues
#   - Tests use Poetry with .venv caching keyed on poetry.lock hash
#   - Docker builds use GitHub Actions cache (type=gha) for layer caching
#   - Fake API keys are set so ChatGroq/ElevenLabs instantiate without error
#   - LANGCHAIN_TRACING_V2=false disables LangSmith connections in CI

name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same branch when a new push arrives.
# Saves CI minutes — no point finishing a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# SHARED CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "2.1.3"

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 1: LINT & FORMAT CHECK
  # ───────────────────────────────────────────────────────────────────────────
  # WHY SEPARATE FROM TEST:
  #   Linting doesn't need Poetry or the full dependency set.
  #   By running it as a separate job, developers get lint feedback in
  #   ~30 seconds instead of waiting 3-5 minutes for Poetry to install.
  lint:
    name: "Lint & Format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install ruff and black directly via pip — no need for Poetry here.
      # We pin to the same versions as pyproject.toml to ensure consistency.
      - name: Install linting tools
        run: pip install "ruff>=0.11.0" "black>=25.0.0"

      # --output-format=github formats ruff errors as GitHub annotations
      # so they appear inline in the PR diff view.
      - name: Run ruff (lint check)
        run: ruff check . --output-format=github

      # --check: exits with non-zero if black would reformat any file
      # --diff:  shows exactly what black would change (helpful in CI logs)
      - name: Run black (format check)
        run: black --check --diff .

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 2: TEST SUITE
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest

    # Test against the locked Python version. Extend to a matrix later if needed.
    strategy:
      fail-fast: false   # Don't cancel other matrix jobs if one fails
      matrix:
        python-version: ["3.11"]

    # ── FAKE API KEYS ────────────────────────────────────────────────────────
    # These are set at the job level so they are available as environment
    # variables from the very first step. This means when Poetry eventually
    # runs `poetry run pytest`, all env vars are already in place.
    #
    # WHY FAKE KEYS WORK:
    #   - ChatGroq validates that GROQ_API_KEY is set (non-empty) at
    #     instantiation time. A fake key passes this check.
    #   - No real API calls are made in tests — only import and structural tests.
    #   - LANGCHAIN_TRACING_V2=false disables all LangSmith network connections.
    env:
      GROQ_API_KEY: "gsk_testfakekey000000000000000000000000000000000000000000000000000000"
      ELEVENLABS_API_KEY: "sk_testfakekey00000000000000000000000000000000000000000000"
      TAVILY_API_KEY: "tvly-test-fake-key-00000000000000000000"
      LANGCHAIN_API_KEY: "lsv2_pt_testfakekey00000000000000000000000000000000"
      LANGCHAIN_TRACING_V2: "false"
      LANGCHAIN_PROJECT: "podcast-agent-ci"
      LANGCHAIN_ENDPOINT: "https://api.smith.langchain.com"
      APP_NAME: "blog-to-podcast-agent"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install Poetry from PyPI. We pin the version so CI is reproducible.
      - name: Install Poetry ${{ env.POETRY_VERSION }}
        run: pip install "poetry==${{ env.POETRY_VERSION }}"

      # Configure Poetry to create the virtualenv INSIDE the project directory
      # at .venv/. This makes it easy to cache with actions/cache.
      - name: Configure Poetry virtualenv location
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      # Cache the .venv directory.
      # KEY: OS + Python version + content hash of poetry.lock
      # If poetry.lock changes (new dependency added/updated), the cache is
      # invalidated and dependencies are re-installed from scratch.
      - name: Cache Poetry virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ matrix.python-version }}-

      # Only install if the cache was not hit (avoids redundant installs).
      # --with dev  : include dev group (ruff, black, pytest, httpx, pytest-mock)
      # --no-interaction : non-interactive mode (no prompts)
      - name: Install dependencies (with dev group)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-interaction --no-ansi --no-root

      # ── IMPORT SMOKE TESTS ───────────────────────────────────────────────
      # Run these explicitly BEFORE pytest so that if imports fail, the error
      # message is clear ("module not found") rather than buried in a test failure.

      - name: "Smoke test: Verify FastAPI app imports"
        run: |
          poetry run python -c "
          from api.main import app
          print(f'✅ FastAPI app imported | title={app.title}')
          "

      - name: "Smoke test: Verify LangGraph compiles"
        run: |
          poetry run python -c "
          from graph.graph import app
          print(f'✅ LangGraph compiled | nodes={list(app.get_graph().nodes.keys())}')
          "

      - name: "Smoke test: Verify Streamlit is installed"
        run: |
          poetry run python -c "
          import streamlit
          print(f'✅ Streamlit {streamlit.__version__} available')
          "

      - name: "Smoke test: Verify LangSmith is installed"
        run: |
          poetry run python -c "
          import langsmith
          print(f'✅ LangSmith {langsmith.__version__} available')
          "

      # ── RUN FULL TEST SUITE ─────────────────────────────────────────────
      # pytest reads configuration from [tool.pytest.ini_options] in pyproject.toml:
      #   testpaths = ["tests"]
      #   addopts   = "-v --tb=short -p no:warnings"
      - name: Run pytest
        run: poetry run pytest tests/ --tb=short -v

      # Upload the test results as a GitHub artifact so you can inspect
      # failures even after the job has passed or been re-run.
      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-py${{ matrix.python-version }}
          path: |
            .pytest_cache/
            pytest.log
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # JOB 3: DOCKER IMAGE BUILD
  # ───────────────────────────────────────────────────────────────────────────
  # WHY THIS RUNS AFTER LINT AND TEST:
  #   Docker builds are expensive (2-5 minutes for a fresh build).
  #   We only build if the code is clean and tests pass.
  #   `needs: [lint, test]` enforces this ordering.
  #
  # WHAT THIS VALIDATES:
  #   - Dockerfile.api syntax and layer order are correct
  #   - Dockerfile.frontend syntax is correct
  #   - docker-entrypoint.sh is correctly included in build context
  #     (this would fail if it were excluded in .dockerignore — bug we fixed)
  #   - All COPY instructions reference files that actually exist
  #   - poetry install inside the container succeeds
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, test]   # Only run after lint and tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker Buildx is required for the build-push-action and for
      # the GitHub Actions layer cache (type=gha).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── BUILD API IMAGE ─────────────────────────────────────────────────
      # push: false   → build locally only, don't push to any registry
      # cache-from/to → use GitHub Actions cache for Docker layer caching.
      #                  First build: all layers downloaded fresh (~4 min).
      #                  Subsequent builds: cached layers reused (~30 sec).
      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          tags: podcast-agent-api:${{ github.sha }}
          # GitHub Actions cache: stores Docker layers between workflow runs
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max

      # ── BUILD FRONTEND IMAGE ────────────────────────────────────────────
      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: podcast-agent-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,scope=frontend-image,mode=max

      # Print image sizes so developers can track image bloat over time
      - name: Report image sizes
        run: |
          echo "=== Docker Image Sizes ==="
          docker images podcast-agent-api:${{ github.sha }} \
            --format "API image: {{.Size}}"
          docker images podcast-agent-frontend:${{ github.sha }} \
            --format "Frontend image: {{.Size}}"

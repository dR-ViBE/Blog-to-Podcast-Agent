# docker-compose.prod.yml
#
# Production deployment configuration for Blog-to-Podcast Agent on AWS EC2.
#
# KEY DIFFERENCES FROM docker-compose.yml (dev):
#   - api + frontend use pre-built ECR images (no local build: step)
#   - No source code bind mounts (no hot-reload in production)
#   - ENVIRONMENT=production, no --reload flag on uvicorn
#   - Ports: api exposed on 8000, frontend on 80
#   - prometheus + grafana available via --profile monitoring
#
# REQUIRED on the EC2 server (in /home/ec2-user/podcast-agent/.env):
#   AWS_ACCOUNT_ID, AWS_REGION, IMAGE_TAG, all API keys
#
# USAGE on EC2:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

services:

  # ─────────────────────────────────────────────────────────────────────────
  # OLLAMA — Local embedding model server
  # Serves nomic-embed-text embeddings used by the retrieval pipeline.
  # Uses a named Docker volume so model weights persist across deployments.
  # ─────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: podcast_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama     # Persists model weights across restarts
    networks:
      - podcast_network
    healthcheck:
      # ollama list succeeds once Ollama server is ready (curl not in ollama image)
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # OLLAMA-PULL — One-shot model download
  # Pulls nomic-embed-text on first boot. Near-instant if already in volume.
  # restart: "no" means it runs once and exits — never restarts.
  # ─────────────────────────────────────────────────────────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: podcast_ollama_pull
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - podcast_network

  # ─────────────────────────────────────────────────────────────────────────
  # API — FastAPI backend
  # Uses pre-built image from ECR. Image URI is composed from env vars in .env.
  # ─────────────────────────────────────────────────────────────────────────
  api:
    # Image pulled from AWS ECR — built by GitHub Actions CD pipeline.
    # ${AWS_ACCOUNT_ID}, ${AWS_REGION}, ${IMAGE_TAG} come from .env on EC2.
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/blog-to-podcast-api:${IMAGE_TAG:-latest}
    container_name: podcast_api
    restart: unless-stopped

    # Load all API keys from the .env file on the EC2 server.
    # Real secrets never live in this file — they're in .env which is never committed.
    env_file:
      - .env

    # Production-specific overrides (take precedence over .env values).
    environment:
      OLLAMA_HOST: http://ollama:11434   # Must point to Docker service, not localhost
      APP_NAME: blog-to-podcast-agent
      APP_VERSION: "1.0.0"
      ENVIRONMENT: production
      ENABLE_METRICS: "true"
      # Cache HuggingFace models in a named volume so CrossEncoder (BAAI/bge-reranker-base)
      # is only downloaded once and persists across container recreations.
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      HF_HOME: /root/.cache/huggingface

    # Production command: NO --reload flag (hot-reload not needed/safe in prod)
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    ports:
      - "8000:8000"    # Exposes FastAPI + Swagger docs externally

    volumes:
      # ChromaDB vector store — persists ingested documents across deployments
      - ./.chroma:/app/.chroma
      # Generated audio files + Prometheus metrics + LangGraph checkpoints
      - ./outputs:/app/outputs
      # HuggingFace model cache — CrossEncoder (BAAI/bge-reranker-base, ~1.1 GB)
      # downloads only on first deploy; reused on all subsequent ones.
      - hf_cache:/root/.cache/huggingface

    depends_on:
      ollama-pull:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Long start_period: first deploy downloads CrossEncoder model (~1.1 GB from HuggingFace).
      # After first deploy the model is cached in hf_cache volume — subsequent startups are fast.
      start_period: 600s

    networks:
      - podcast_network

  # ─────────────────────────────────────────────────────────────────────────
  # FRONTEND — Streamlit UI
  # Uses pre-built image from ECR.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/blog-to-podcast-frontend:${IMAGE_TAG:-latest}
    container_name: podcast_frontend
    restart: unless-stopped
    environment:
      # API_BASE_URL tells Streamlit where to reach FastAPI.
      # Uses Docker internal network (service name), not localhost.
      API_BASE_URL: http://api:8000
    ports:
      - "80:8501"      # Serve on port 80 so users hit http://<IP> (no port in URL)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - podcast_network

  # ─────────────────────────────────────────────────────────────────────────
  # PROMETHEUS — Metrics collection (optional, behind profile flag)
  # Start with: docker compose -f docker-compose.prod.yml --profile monitoring up -d
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: podcast_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"    # Localhost only — not exposed publicly
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks:
      - podcast_network

  # ─────────────────────────────────────────────────────────────────────────
  # GRAFANA — Metrics visualisation (optional, behind profile flag)
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: podcast_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"    # Localhost only — SSH tunnel to view
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - podcast_network

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES — All named volumes persist across `docker compose down` + `up`
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: podcast_agent_ollama_data    # Ollama model weights (~270 MB)
  hf_cache:
    name: podcast_agent_hf_cache       # HuggingFace CrossEncoder model (~1.1 GB, downloaded once)
  prometheus_data:
    name: podcast_agent_prometheus_data
  grafana_data:
    name: podcast_agent_grafana_data

# ─────────────────────────────────────────────────────────────────────────────
# NETWORKS
# ─────────────────────────────────────────────────────────────────────────────
networks:
  podcast_network:
    name: podcast_agent_production_network
    driver: bridge

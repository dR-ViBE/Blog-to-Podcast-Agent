[project]
name = "podcast-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "ganesh",email = "ganeshprabakaran876@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain (>=1.2.0,<2.0.0)",
    "langgraph (>=1.0.5,<2.0.0)",
    "langchain-groq (>=1.1.1,<2.0.0)",
    "tavily-python (>=0.7.17,<0.8.0)",
    "chromadb (>=1.4.0,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "langchain-text-splitters (>=1.1.0,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langsmith (>=0.5.2,<0.6.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "langchain-tavily (>=0.2.16,<0.3.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "fastapi (>=0.138.1,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "streamlit (>=1.58.0,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "ragas (>=0.4.3,<0.5.0)",
    "pypdf (>=6.14.2,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


# ─── Development dependencies ─────────────────────────────────────────────────
# Installed with: poetry install --with dev
# NOT installed in the production Docker image (--without dev flag in Dockerfile.api)
[tool.poetry.group.dev.dependencies]
ruff = ">=0.11.0"
black = ">=25.0.0"
pytest = ">=8.0.0"
pytest-mock = ">=3.14.0"
httpx = ">=0.27.0"          # Required by FastAPI's TestClient in Starlette >= 0.21


# ─── Ruff (linting) ───────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "__pycache__", ".git", "outputs", ".chroma"]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, W = warnings, I = isort
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — black handles line length enforcement
    "E402",   # module-level import not at top — some files do this intentionally
    "F401",   # imported but unused — some imports are used only in type annotations
    "W291",   # trailing whitespace — handled by editors
    "W293",   # whitespace before comment
]


# ─── Black (formatting) ───────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]
# Exclude generated/data directories from formatting
exclude = '''
/(
    \.venv
    | \.git
    | __pycache__
    | outputs
    | \.chroma
)/
'''


# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
# Where to look for tests
testpaths = ["tests"]
# File and function naming conventions
python_files  = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Default flags: verbose output, short tracebacks, show locals on failure
addopts = "-v --tb=short -p no:warnings"
